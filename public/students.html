<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سجل الطلبة | مدرسة قطر</title>
  <link rel="icon" href="school-logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="site-nav.css" />
  <style>
    .wrap { max-width: 1040px; margin: -24px auto 48px; padding: 0 16px; position: relative; z-index: 1; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .filters select, .filters input {
      font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); min-width: 160px; background: #fff;
    }
    .stats { color: var(--muted); margin-bottom: 14px; font-weight: 600; }
    .grade-block { margin-bottom: 22px; overflow: hidden; }
    .grade-title {
      background: linear-gradient(135deg, var(--navy), #15365f); color: #fff;
      padding: 14px 18px; font-weight: 800; font-size: 1.05rem;
    }
    .section-title {
      background: #e8eef8; color: var(--navy-mid); padding: 10px 18px; font-weight: 700;
      border-bottom: 1px solid var(--border);
    }
    .student-card {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 16px;
      padding: 16px 18px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }
    .student-card:last-child { border-bottom: 0; }
    .photo-wrap {
      width: 108px; height: 132px; border-radius: 14px; overflow: hidden;
      background: #eef2f7; border: 1px solid var(--border);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .photo-fallback { color: var(--muted); font-size: 0.78rem; text-align: center; padding: 8px; font-weight: 700; }
    .student-main strong { display: block; font-size: 1.08rem; color: var(--navy); margin-bottom: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip {
      display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px;
      background: #f1f5fb; color: #274876; font-size: 0.78rem; font-weight: 700;
    }
    .meta-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px;
      color: var(--muted); font-size: 0.9rem; margin-top: 4px;
    }
    .meta-grid span b { color: var(--text); font-weight: 700; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions a, .actions button {
      font: inherit; font-weight: 700; text-decoration: none; border: none; cursor: pointer;
      background: var(--accent-soft); color: #1e4ea8; padding: 8px 12px; border-radius: 9px;
    }
    .actions a.secondary { background: #eef8f2; color: #0f7a45; }
    .detail {
      display: none; grid-column: 1 / -1; margin-top: 4px;
      background: linear-gradient(180deg, #f7f9fc, #fff); border: 1px solid #e2e8f2;
      border-radius: 14px; padding: 14px;
    }
    .detail.open { display: block; }
    .detail-sections { display: grid; gap: 12px; }
    .detail-block h4 {
      margin: 0 0 8px; color: var(--navy); font-size: 0.95rem;
      padding-bottom: 6px; border-bottom: 1px solid #e5ebf4;
    }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; font-size: 0.9rem; }
    .kv dt { color: var(--muted); font-weight: 700; }
    .kv dd { margin: 0; color: var(--text); font-weight: 600; word-break: break-word; }
    .detail-photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .detail-photos a {
      display: inline-flex; flex-direction: column; align-items: center; gap: 6px;
      text-decoration: none; color: var(--navy-mid); font-weight: 700; font-size: 0.82rem;
    }
    .detail-photos img {
      width: 120px; height: 150px; object-fit: cover; border-radius: 12px;
      border: 1px solid var(--border); background: #fff;
    }
    .empty {
      background: #fff; border: 1px dashed var(--border); border-radius: 12px;
      padding: 28px; text-align: center; color: var(--muted);
    }
    .top-links { margin-bottom: 14px; display:flex; gap:16px; flex-wrap:wrap; }
    .top-links a { color: #fff; font-weight: 700; opacity: 0.9; }
    .persist-note {
      margin-top: 10px; font-size: 0.86rem; color: #3d5a80; background: #eef5ff;
      border-radius: 10px; padding: 10px 12px; font-weight: 600;
    }
    @media (max-width: 640px) {
      .student-card { grid-template-columns: 84px 1fr; gap: 12px; }
      .photo-wrap { width: 84px; height: 104px; }
      .meta-grid { grid-template-columns: 1fr; }
      .kv { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="التنقل الرئيسي">
    <div class="site-nav-inner">
      <a class="site-nav-brand" href="/">
        <img src="school-logo.png" alt="" width="36" height="36" />
        <span>مدرسة قطر الابتدائية</span>
      </a>
      <div class="site-nav-links">
        <a href="/">الرئيسية</a>
        <a href="/form">الاستمارة</a>
        <a href="/students.html" aria-current="page">سجل الطلبة</a>
        <a href="#" id="logoutLink" class="site-nav-admin">تسجيل الخروج</a>
      </div>
    </div>
  </nav>
  <header class="hero" style="padding-bottom: 40px">
    <div class="hero-inner">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
        <img src="school-logo.png" alt="" width="56" height="56" style="background:#fff;border-radius:12px;padding:4px" />
        <div>
          <h1 style="font-size: 1.7rem; margin:0">سجل الطلبة المحفوظ</h1>
          <p class="hero-desc" style="margin:4px 0 0">مدرسة قطر الابتدائية — مرتّب حسب الصف والشعبة</p>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="card" style="margin-bottom: 16px">
      <div class="filters">
        <select id="gradeFilter"><option value="">كل الصفوف</option></select>
        <select id="sectionFilter"><option value="">كل الشعب</option></select>
        <input id="search" type="search" placeholder="بحث بالاسم أو الهاتف أو رقم البطاقة أو رقم الطلب" />
      </div>
      <div class="stats" id="stats">جاري التحميل...</div>
      <div class="persist-note">السجل وصورة الطالب يُحفظان محلياً مع نسخة دائمة — لا تختفي بعد تحديث الموقع.</div>
    </div>
    <div id="list"></div>
  </div>

  <script>
    const gradeFilter = document.getElementById("gradeFilter");
    const sectionFilter = document.getElementById("sectionFilter");
    const search = document.getElementById("search");
    const list = document.getElementById("list");
    const stats = document.getElementById("stats");
    let allStudents = [];
    let registry = null;

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fmtDate(iso) {
      if (!iso) return "—";
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return `${m[3]}/${m[2]}/${m[1]}`;
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return esc(iso);
      return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
    }

    function fileUrl(rel) {
      if (!rel) return "";
      return `/data-files/${String(rel).replace(/^\/+/, "")}`;
    }

    function fillFilters() {
      const grades = Object.keys(registry?.grades || {});
      gradeFilter.innerHTML = '<option value="">كل الصفوف</option>' +
        grades.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`).join("");
      updateSectionOptions();
    }

    function updateSectionOptions() {
      const g = gradeFilter.value;
      const sections = new Set();
      if (g && registry.grades[g]) {
        Object.keys(registry.grades[g]).forEach((s) => sections.add(s));
      } else {
        Object.values(registry.grades || {}).forEach((secMap) => {
          Object.keys(secMap || {}).forEach((s) => sections.add(s));
        });
      }
      const cur = sectionFilter.value;
      sectionFilter.innerHTML = '<option value="">كل الشعب</option>' +
        [...sections].map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
      if ([...sectionFilter.options].some((o) => o.value === cur)) sectionFilter.value = cur;
    }

    function filtered() {
      const q = search.value.trim();
      return allStudents.filter((s) => {
        if (gradeFilter.value && s.grade !== gradeFilter.value) return false;
        if (sectionFilter.value && s.section !== sectionFilter.value) return false;
        if (!q) return true;
        return [s.fullName, s.phone, s.nationalId, s.id].some((v) => String(v || "").includes(q));
      });
    }

    function kvBlock(title, pairs) {
      const rows = pairs
        .map(([k, v]) => `<div class="kv"><dt>${esc(k)}</dt><dd>${esc(v || "—")}</dd></div>`)
        .join("");
      return `<div class="detail-block"><h4>${esc(title)}</h4>${rows}</div>`;
    }

    function render() {
      const students = filtered();
      stats.textContent = `المعروض: ${students.length} من أصل ${registry?.total || 0} طالب محفوظ`;

      if (!students.length) {
        list.innerHTML = '<div class="empty">لا توجد استمارات محفوظة بعد.</div>';
        return;
      }

      const grouped = {};
      for (const s of students) {
        if (!grouped[s.grade]) grouped[s.grade] = {};
        if (!grouped[s.grade][s.section]) grouped[s.grade][s.section] = [];
        grouped[s.grade][s.section].push(s);
      }

      list.innerHTML = Object.entries(grouped).map(([grade, sections]) => `
        <div class="grade-block card" style="padding:0">
          <div class="grade-title">${esc(grade)}</div>
          ${Object.entries(sections).map(([section, items]) => `
            <div class="section-title">الشعبة ${esc(section)} — ${items.length} طالب</div>
            ${items.map((s) => `
              <div class="student-card">
                <div class="photo-wrap">
                  ${s.photo
                    ? `<img src="${esc(fileUrl(s.photo))}" alt="صورة ${esc(s.fullName || "")}" loading="lazy" />`
                    : `<div class="photo-fallback">لا توجد<br>صورة</div>`}
                </div>
                <div class="student-main">
                  <strong>${esc(s.fullName || "بدون اسم")}</strong>
                  <div class="chips">
                    <span class="chip">${esc(s.id || "—")}</span>
                    <span class="chip">${esc(s.grade)} / ${esc(s.section)}</span>
                    ${s.gender ? `<span class="chip">${esc(s.gender)}</span>` : ""}
                  </div>
                  <div class="meta-grid">
                    <span>الهاتف: <b>${esc(s.phone || "—")}</b></span>
                    <span>البطاقة: <b>${esc(s.nationalId || "—")}</b></span>
                    <span>الميلاد: <b>${fmtDate(s.birthDate)}</b></span>
                    <span>الحفظ: <b>${fmtDate(s.savedAt)}</b></span>
                  </div>
                  <div class="actions">
                    <button type="button" data-id="${esc(s.id)}">عرض التفاصيل الكاملة</button>
                    ${s.photo ? `<a class="secondary" href="${esc(fileUrl(s.photo))}" target="_blank">صورة الطالب</a>` : ""}
                    ${s.collage ? `<a href="${esc(fileUrl(s.collage))}" target="_blank">المستمسكات</a>` : ""}
                  </div>
                </div>
                <div class="detail" id="detail-${esc(s.id)}"></div>
              </div>
            `).join("")}
          `).join("")}
        </div>
      `).join("");

      list.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          const box = document.getElementById(`detail-${id}`);
          if (box.classList.contains("open") && box.dataset.loaded) {
            box.classList.toggle("open");
            return;
          }
          box.innerHTML = "جاري التحميل...";
          box.classList.add("open");
          const res = await fetch(`/api/students/${encodeURIComponent(id)}`);
          const data = await res.json();
          if (!data.ok) {
            box.textContent = data.error || "تعذّر التحميل";
            return;
          }
          const r = data.student;
          const p = r.personal || {};
          const c = r.contact || {};
          const a = r.address || {};
          const ac = r.academic || {};
          box.dataset.loaded = "1";
          box.innerHTML = `
            <div class="detail-sections">
              ${kvBlock("الهوية", [
                ["رقم الطلب", r.id],
                ["الاسم الكامل", r.fullName],
                ["اسم الأم", p.motherName],
                ["والد الأم", p.maternalGrandfather],
                ["جد الأم", p.maternalGreatGrandfather],
              ])}
              ${kvBlock("التفاصيل الشخصية", [
                ["تاريخ الولادة", fmtDate(p.birthDate)],
                ["محل الولادة", p.birthPlace],
                ["الجنس", p.gender],
                ["الجنسية", p.nationality],
                ["اللغة الأم", p.motherTongue],
                ["فئة الدم", p.bloodType],
              ])}
              ${kvBlock("التواصل والوثائق", [
                ["الهاتف", c.phone],
                ["البريد", c.email],
                ["نوع الوثيقة", c.docType],
                ["بلد الإصدار", c.issueCountry],
                ["رقم البطاقة", c.nationalId],
              ])}
              ${kvBlock("عنوان السكن", [
                ["المحافظة", a.governorate],
                ["القضاء / الناحية", a.district],
                ["الحي", a.neighborhood],
                ["المحلة", a.locality],
                ["الزقاق", a.alley],
                ["رقم الدار", a.houseNumber],
                ["أقرب نقطة", a.landmark],
              ])}
              ${kvBlock("البيانات الدراسية", [
                ["المدرسة", ac.schoolName],
                ["الصف", ac.grade],
                ["الشعبة", ac.section],
                ["لغة الدراسة", ac.studyLanguage],
                ["منحة الرعاية", ac.socialGrant],
                ["المستوى المعيشي", ac.livingLevel],
                ["ملاحظات", ac.notes || "لا يوجد"],
              ])}
              <div class="detail-block">
                <h4>الصور المحفوظة</h4>
                <div class="detail-photos">
                  ${r.photo ? `<a href="${esc(fileUrl(r.photo))}" target="_blank"><img src="${esc(fileUrl(r.photo))}" alt="صورة الطالب" /><span>صورة الطالب</span></a>` : "<span>لا توجد صورة طالب</span>"}
                  ${r.collage ? `<a href="${esc(fileUrl(r.collage))}" target="_blank"><img src="${esc(fileUrl(r.collage))}" alt="مستمسكات" style="object-fit:contain;background:#f3f5f8" /><span>المستمسكات</span></a>` : ""}
                </div>
              </div>
            </div>
          `;
        });
      });
    }

    async function load() {
      const res = await fetch("/api/students");
      const data = await res.json();
      if (!data.ok) {
        stats.textContent = data.error || "فشل التحميل";
        if (res.status === 401) location.href = "/admin-login.html";
        return;
      }
      registry = data.registry;
      allStudents = data.students;
      fillFilters();
      render();
    }

    gradeFilter.addEventListener("change", () => { updateSectionOptions(); render(); });
    sectionFilter.addEventListener("change", render);
    search.addEventListener("input", render);
    document.getElementById("logoutLink")?.addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/admin/logout", { method: "POST" });
      location.href = "/admin-login.html";
    });
    load();
  </script>
</body>
</html>
